{% extends "base.html" %}
{% block title %}{{ "Edit plot" if plot else "Add a plot" }}{% endblock %}
{% block content %}
{% include "_farm_nav.html" %}
<h1>{{ "Edit plot" if plot else "Add a plot" }}</h1>
<form method="post" class="stacked">
  <label>Plot name <input name="name" value="{{ form.get('name')|blank }}" maxlength="100" required></label>
  <label>Area in square metres <span class="hint">optional</span>
    <input name="area_sq_m" type="number" step="0.01" min="0.01" value="{{ form.get('area_sq_m')|blank }}"></label>
  <button>{{ "Save" if plot else "Add plot" }}</button>
</form>
{% endblock %}
